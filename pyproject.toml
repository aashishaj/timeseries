[project]
name = "nse-forecasting"
version = "0.1.0"
description = "Honest, walk-forward evaluation of time series forecasting models on NSE intraday candles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arch>=7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.scripts]
forecasting = "forecasting.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forecasting"]
exclude = ["forecasting/notebooks", "forecasting/tests"]

[tool.pytest.ini_options]
testpaths = ["forecasting/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
