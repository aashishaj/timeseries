# NSE equity cash-market calendar.
#
# VERIFY against NSE's official holiday circulars before trusting results:
#   https://www.nseindia.com/resources/exchange-communication-holidays
# `forecasting validate` cross-checks this file against your candle export and
# flags (a) dates with data that this file says are closed and (b) sessions in
# this file where none of your symbols have any data.
#
# holidays:          weekday closures (weekends are closed implicitly)
# extra_sessions:    weekend dates with a FULL regular 09:15-15:30 session (e.g. Budget day)
# special_sessions:  known non-regular sessions (Muhurat, DR drills). They are NOT
#                    modelled; listed only so `validate` can explain their data.

timezone: Asia/Kolkata
regular_session:
  open: "09:15"
  close: "15:30"

years:
  2024:
    holidays:
      2024-01-22: Special holiday (Ram Mandir pran pratishtha)
      2024-01-26: Republic Day
      2024-03-08: Mahashivratri
      2024-03-25: Holi
