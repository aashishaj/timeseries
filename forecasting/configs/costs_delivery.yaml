# Zerodha equity DELIVERY (CNC) charges, per executed order side.
# VERIFY against https://zerodha.com/charges before trusting P&L numbers.
brokerage_rate: 0.0           # delivery is brokerage-free ...
brokerage_cap_inr: 0
stt_buy_rate: 0.001           # ... but STT is 0.1% on the buy side
stt_sell_rate: 0.001          # and 0.1% on the sell side (4x the intraday rate)
exchange_rate: 0.0000297      # NSE transaction charge
sebi_rate: 0.000001           # Rs 10 per crore
stamp_buy_rate: 0.00015       # stamp duty 0.015% on the buy side
gst_rate: 0.18                # on brokerage + exchange + SEBI charges
dp_sell_inr: 15.34            # depository charge per stock sold per day, any quantity
slippage_bps: 2.0             # assumed per side; fills are simulated at the open price
