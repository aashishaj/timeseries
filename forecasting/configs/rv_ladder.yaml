name: rv_ladder
description: >-
  Realized volatility of 5-minute returns, next 30 minutes and next session.
  Every model on the ladder so far, against the naive random walk.

symbols: symbols.yaml          # paths relative to this file
calendar: nse_calendar.yaml
data: data.yaml
bar_minutes: 5

horizons:
  - name: 30min
    bars: 6                    # 6 x 5-min bars
    origin: intraday           # a forecast at every bar close with 30 min left in the session
    stride: 1
  - name: next_session
    bars: session              # all 75 bars of the next session
    origin: session_open       # forecast made before the open (after the previous close)

walk_forward:
  initial_train_sessions: 60   # ~3 months before the first forecast
  test_block_sessions: 5       # refit weekly
  window: expanding            # or: rolling (+ rolling_train_sessions)
  holdout_sessions: 40         # LOCKBOX: last ~2 months, untouched until `backtest --final`

baseline: naive
models:
  # rung 1: baselines
  - {name: naive, type: random_walk, rung: 1}
  - {name: hist_mean, type: historical_mean, rung: 1}
  - {name: seasonal_mean_5d, type: seasonal_naive, rung: 1, params: {n_sessions: 5}}
  # rung 2: classical. Daily level x time-of-day profile (x intraday correction)
  - {name: ewma_hl1, type: ewma, rung: 2, params: {halflife_sessions: 1.0}}
  - {name: ewma_hl5, type: ewma, rung: 2, params: {halflife_sessions: 5.0}}
  - {name: har, type: har, rung: 2, params: {pooled: false}}
  - {name: har_pooled, type: har, rung: 2, params: {pooled: true}}
  - {name: har_mix, type: har, rung: 2, params: {pooled: true, intraday_beta: 0.5}}
  - {name: arma_logrv_mix, type: arma_logrv, rung: 2, params: {order: [1, 1], intraday_beta: 0.5}}
  - {name: garch, type: garch, rung: 2, params: {asymmetric: false}}
  - {name: gjr_garch, type: garch, rung: 2, params: {asymmetric: true}}
  # rung 3: ML. Anchor (5-session RV x time-of-day share) x boosted correction from
  # realized measures, range estimators, ATR, Bollinger width, RSI, volume, time
  - {name: lgbm, type: lightgbm, rung: 3}
  # rung 4: deep / foundation models (CPU only; torch required).
  - name: nbeats
    type: nbeats
    rung: 4
    params: {lookback_days: 30, n_blocks: 4, width: 64, n_epochs: 100, intraday_beta: 0.5}
  - name: nbeats_deep
    type: nbeats
    rung: 4
    params: {lookback_days: 60, n_blocks: 6, width: 128, n_epochs: 150, intraday_beta: 0.5}
  - name: chronos_tiny
    type: chronos
    rung: 4
    params: {model_id: "amazon/chronos-t5-tiny", num_samples: 100, intraday_beta: 0.5}
  # rung 5: our own mixes (now including best of rung 4 as candidates).
  # Geometric combination of the best intraday and best daily models.
  - name: combo_equal
    type: combination
    rung: 5
    params:
      method: equal
      members: &combo_members
        - {type: lightgbm}
        - {type: garch}
        - {type: arma_logrv, params: {order: [1, 1], intraday_beta: 0.5}}
        - {type: har, params: {pooled: true, intraday_beta: 0.5}}
  - name: combo_opt
    type: combination
    rung: 5
    params:
      method: qlike_opt       # weights + bias fitted on the last 10 training sessions
      members: *combo_members

output_dir: results/rv_ladder
